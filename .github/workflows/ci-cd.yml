name: StatusFlow CI/CD Production Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8.15.1

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Workspace
        run: pnpm --recursive exec tsc --noEmit

      - name: Execute Automated Unit & Integration Tests
        run: pnpm test

      - name: Build Web Production Bundle
        run: pnpm --filter @statusflow/web build

  deploy-production:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy API & Worker Containers to AWS ECS / Render
        run: echo "Deploying Docker container images to production registry..."
