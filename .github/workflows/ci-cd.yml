name: StatusFlow CI/CD Production Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        # Explicit Node 22 to match both Dockerfiles — @supabase/supabase-js needs the
        # native WebSocket global only Node 22+ provides. Without this the job runs on
        # whatever Node version the runner defaults to, which can pass here and still break
        # in the actual container.
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        # No `version:` here on purpose — pnpm/action-setup reads it from the
        # `packageManager` field in package.json, which is the single source of truth for
        # the version that actually generated pnpm-lock.yaml. Pinning a different version
        # here (this used to hardcode 8.15.1 against a lockfileVersion '9.0' file, which
        # only pnpm 9+ can even read) makes `--frozen-lockfile` below fail immediately with
        # "Cannot install with frozen-lockfile because pnpm-lock.yaml is absent" — pnpm
        # doesn't error on an incompatible lockfile, it just can't parse it and treats it as
        # missing. That failure meant this job — and therefore the deploy job that depends
        # on it — never passed on any push to main.
        uses: pnpm/action-setup@v3

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared Packages
        # packages/subscriptions and packages/baileys-engine are the only workspace
        # packages whose package.json points `main`/`types` at dist/ instead of src/
        # directly, so anything importing them (apps/web imports @statusflow/subscriptions,
        # apps/api and apps/worker import @statusflow/baileys-engine) needs their dist/*.d.ts
        # generated first, or the typecheck step below fails with "Cannot find module" —
        # exactly what happened once the pnpm-version fix above got this far for the first
        # time.
        run: pnpm --filter @statusflow/subscriptions --filter @statusflow/baileys-engine run build

      - name: Typecheck Workspace
        # Not `pnpm --recursive exec tsc --noEmit` — several shared packages
        # (packages/types, ui, api-client, validation, utils) intentionally have no
        # tsconfig.json of their own (they're plain TS consumed straight from src by
        # whichever app imports them, typechecked as part of that app's build), so running
        # tsc in every workspace package unconditionally fails on those with no config to
        # find. Only typecheck the packages/apps that actually declare one.
        run: |
          set -e
          for f in $(find . -maxdepth 3 -iname "tsconfig.json" -not -path "*/node_modules/*"); do
            d=$(dirname "$f")
            echo "== Typechecking $d =="
            (cd "$d" && npx tsc --noEmit -p tsconfig.json)
          done

      # No automated test suite exists in this repo yet — there's nothing for `pnpm test`
      # to run (no package defines a "test" script), so that step would fail this job on
      # every push. Add it back once real tests exist.

      - name: Build Web Production Bundle
        run: pnpm --filter @statusflow/web build

  docker-build-verify:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Actual production deployment is handled entirely by Railway's own GitHub
      # integration — it rebuilds and redeploys apps/api's and apps/worker's services
      # straight from these Dockerfiles on every push to main, independent of this workflow.
      # This job's only purpose is to catch a Dockerfile-level break (e.g. the unpinned-pnpm-
      # version bug that silently failed every Railway deploy for hours before anyone
      # noticed) in CI before it ever reaches Railway — build-and-test above never actually
      # builds either Dockerfile, so nothing else in this pipeline would have caught it.
      - name: Build API Docker Image
        run: docker build -f apps/api/Dockerfile -t statusflow-api:ci .

      - name: Build Worker Docker Image
        run: docker build -f apps/worker/Dockerfile -t statusflow-worker:ci .
