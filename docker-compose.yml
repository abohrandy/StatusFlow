version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: statusflow_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: statusflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seeds/001_seed_plans_and_data.sql:/docker-entrypoint-initdb.d/02_seeds.sql

  redis:
    image: redis:7-alpine
    container_name: statusflow_redis
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: statusflow_api
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/statusflow
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: statusflow_worker
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/statusflow
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
